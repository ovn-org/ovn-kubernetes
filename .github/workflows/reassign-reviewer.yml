name: "Request Another Reviewer"

# Lets anyone move a PR forward by pulling in another reviewer from the
# ovn-kubernetes-reviewers-copy team. Commenting `/assign-reviewer` requests the
# team, so GitHub's code-review assignment (configured on the team) routes the PR
# to an available member. The intent is that a PR keeps getting reviewed even when
# the original assignee needs help, lacks the expertise, or is unavailable — the
# goal is a reviewed PR, not that any one person does the review.
#
# ovn-kubernetes-reviewers-copy mirrors the ovn-kubernetes-reviewers membership.
# ovn-kubernetes-reviewers itself is the CODEOWNERS default owner, so GitHub
# requests it on every PR and locks that request; requesting a team that is
# already requested is a silent no-op, which made re-requests impossible.
# Using a separate team keeps its requests unlocked and re-requestable.

on:
  issue_comment:
    types: [created]

jobs:
  request-reviewer:
    # React only to /assign-reviewer in a human comment on a PR. The exact
    # position check happens in the script because expressions cannot trim
    # leading whitespace. Ignore Bot-authored comments so the workflow never
    # reacts to its own confirmation/error messages.
    if: >
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '/assign-reviewer')
    runs-on: ubuntu-26.04
    steps:
      # Use the same app token the repo uses for privileged PR automation:
      # requesting an org team as a reviewer needs more than the default
      # GITHUB_TOKEN's org visibility.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OVN_KUBERNETES_MERGE_BOT }}
          private-key: ${{ secrets.OVN_KUBERNETES_MERGE_BOT }}

      - name: Request the ovn-kubernetes-reviewers-copy team for review
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // The command must start the comment, ignoring surrounding whitespace
            // (web/mobile clients may prepend a newline).
            if (!process.env.COMMENT_BODY.trim().startsWith('/assign-reviewer')) {
              core.info('Comment does not start with /assign-reviewer, ignoring');
              return;
            }

            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const team = 'ovn-kubernetes-reviewers-copy';

            try {
              // If every member was busy on the previous request, GitHub leaves the
              // team itself listed as a pending reviewer, and requesting an already
              // requested team is a silent no-op. Remove that stale request first so
              // this command always triggers a new routing attempt. Unlike the
              // CODEOWNERS team, the copy team's request is not locked and can be
              // removed.
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
              if (pr.requested_teams.some(t => t.slug === team)) {
                await github.rest.pulls.removeRequestedReviewers({
                  owner, repo, pull_number, reviewers: [], team_reviewers: [team],
                });
              }
              // Requesting the team triggers its code-review assignment, which
              // load-balances the PR onto a member from the pool.
              await github.rest.pulls.requestReviewers({
                owner, repo, pull_number, team_reviewers: [team],
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: pull_number,
                body: `Requested a review from \`@${owner}/${team}\` — GitHub will ` +
                      `route this to an available member. If it lands on someone who ` +
                      `is already assigned, comment \`/assign-reviewer\` again.`,
              });
            } catch (e) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pull_number,
                body: `Could not request the \`${team}\` team: ${e.message}`,
              });
              throw e;
            }
