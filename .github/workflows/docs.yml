# docs-versioning.yml now handles deployment using mike (multi-version site
# on the gh-pages branch) while this workflow handles the docs build pieces.
name: Test Docs Build

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test-deploy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: |
          pip install mkdocs-material
          pip install mkdocs-awesome-pages-plugin
          pip install $(mkdocs-get-deps)
      - run: mkdocs build --strict
      - name: Test root 404 install helper
        run: ./hack/test-install-gh-pages-404.sh
      - name: Upload Artifact (Test)
        uses: actions/upload-artifact@v7
        with:
          name: test-mkdocs-site
          path: ./site
