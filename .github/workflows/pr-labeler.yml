name: "Pull Request Labeler"
on:
  pull_request_target:
  workflow_run:
    workflows: ["Pull Request Review"]
    types: [completed]

jobs:
  labeler:
    if: github.event_name == 'pull_request_target'
    concurrency:
      group: pr-labeler-${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/labeler@v5
    # pull_request_target runs trusted base code, including the size-labeling script.
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: .github/scripts
    - name: Label PR size
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        script: |
          const labelPRSize = require('./.github/scripts/label-pr-size.js');
          await labelPRSize({ github, context, core });

  approval-labeler:
    # Refresh on PR changes or successful review workflow completion.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request_review' &&
       github.event.workflow_run.conclusion == 'success')
    concurrency:
      # Use the same source branch key for PR and review events, including forks.
      group: >-
        pr-approval-${{
          github.event.pull_request.head.repo.id ||
          github.event.workflow_run.head_repository.id
        }}-${{
          github.event.pull_request.head.ref ||
          github.event.workflow_run.head_branch
        }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
        sparse-checkout: .github/scripts
    - name: Label PR approvals
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        script: |
          const labelPRApproval = require('./.github/scripts/label-pr-approval.js');
          await labelPRApproval({ github, context, core });
