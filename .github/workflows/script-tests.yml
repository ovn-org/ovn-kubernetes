name: Script tests

on:
  pull_request:
    paths:
    - '.github/scripts/**'
    - '.github/workflows/script-tests.yml'
  push:
    branches: [master, release-*]
    paths:
    - '.github/scripts/**'
    - '.github/workflows/script-tests.yml'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Test scripts
      run: node --test .github/scripts/*.test.js
