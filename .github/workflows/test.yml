name: ovn-ci

on:
  merge_group:
  pull_request:
    branches: [ master,release-* ]
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ovn-ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  K8S_VERSION: v1.36.4
  KIND_CLUSTER_NAME: ovn
  KIND_INSTALL_INGRESS: true
  KIND_ALLOW_SYSTEM_WRITES: true
  ENABLE_COREDUMPS: true
  # This skips tests tagged as Serial for most lanes
  # Serial tests are run in a dedicated lane
  PARALLEL: true

  # This must be a directory
  CI_IMAGE_CACHE: tmp/image_cache/
  CI_IMAGE_BASE_TAR: image-base.tar
  CI_IMAGE_PR_TAR: image-pr.tar
  CI_DIST_IMAGES_OUTPUT: dist/images/_output/

  # To run CI over custom OVN
  # OVN_REPO: https://github.com/ovn-org/ovn
  # OVN_GITREF: main

jobs:
  changes:
    name: Check changed files
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      run_ci: ${{ steps.filter.outputs.run_ci }}
    steps:
    - name: Check whether CI is needed
      id: filter
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        script: |
          // Scheduled, manual, and merge-group runs always run the full CI suite.
          if (context.eventName !== 'pull_request') {
            core.setOutput('run_ci', 'true');
            return;
          }
          const files = await github.paginate(github.rest.pulls.listFiles, {
            ...context.repo,
            pull_number: context.issue.number,
            per_page: 100,
          });
          const isDoc = path => path.startsWith('docs/') || path.endsWith('.md') ||
            path === 'mkdocs.yml' || path.startsWith('.github/ISSUE_TEMPLATE/');
          // The API caps results at 3000 files. Never skip CI on an incomplete list.
          // Check both paths of a rename so moving code into docs still runs CI.
          const runCI = files.length === 0 || files.length >= 3000 ||
            files.some(file => !isDoc(file.filename) ||
              (file.previous_filename && !isDoc(file.previous_filename)));
          core.setOutput('run_ci', String(runCI));

  go-cache:
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    uses: ./.github/workflows/prepare-go-cache.yml

  # separate job for parallelism
  verify-lint-generated-code:
    needs: [ changes, go-cache ]
    if: needs.changes.outputs.run_ci == 'true'
    name: Verify lint and generated code
    runs-on: ubuntu-24.04
    steps:
    - name: Check out code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: ./.github/actions/setup-go
      id: go

    - name: Verify linting rules are enforced
      run: |
        set -x
        # Run natively so golangci-lint uses the Go toolchain from setup-go
        # (go-version-file: go-controller/go.mod), not the version baked into
        # the golangci-lint container image.
        make -C go-controller/ lint CONTAINER_RUNTIME=run-natively

    - name: Verify generated code is up to date
      run: |
        cd go-controller
        make verify-codegen

    - name: Verify generated mocks are up to date
      run: |
        cd go-controller
        make verify-mocksgen

  build-base:
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    name: Build-base
    runs-on: ubuntu-24.04
    steps:
    # Create a cache for the built base image
    - name: Restore base image cache
      id: image_cache_base
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.CI_IMAGE_CACHE }}
        key: ${{ github.run_id }}-image-cache-base
    # if CI_IMAGE_BASE_TAR isn't in cache, try pulling it and saving to the cache rather
    # than building, resort back to building if the cache isn't populated and
    # pulling the image fails.
    - name: Check if base image build is needed
      id: is_base_image_build_needed
      continue-on-error: false
      run: |
        set -x
        if [ -f ${CI_IMAGE_CACHE}${CI_IMAGE_BASE_TAR}.gz ]; then
            cp ${CI_IMAGE_CACHE}/${CI_IMAGE_BASE_TAR}.gz ${CI_IMAGE_BASE_TAR}.gz
            gunzip ${CI_IMAGE_BASE_TAR}.gz
            echo "BASE_IMAGE_RESTORED_FROM_CACHE=true" >> "$GITHUB_OUTPUT"
            echo "BASE_IMAGE_RESTORED=true" >> "$GITHUB_OUTPUT"
            exit 0
        fi

        if docker pull ghcr.io/ovn-kubernetes/ovn-kubernetes/ovn-kube-fedora:${{ github.base_ref || github.ref_name }}; then
            docker tag ghcr.io/ovn-kubernetes/ovn-kubernetes/ovn-kube-fedora:${{ github.base_ref || github.ref_name }} ovn-daemonset-fedora:dev

            echo "BASE_IMAGE_RESTORED=true" >> "$GITHUB_OUTPUT"
            exit 0
        fi
    # only run the following steps if the base image was not found in the cache
    - name: Check out code into the Go module directory - from base branch
      if: steps.is_base_image_build_needed.outputs.BASE_IMAGE_RESTORED != 'true' && success()
      uses: actions/checkout@v6
      with:
        ref: ${{ github.base_ref || github.ref_name }}

    - name: Set up Go
      if: steps.is_base_image_build_needed.outputs.BASE_IMAGE_RESTORED != 'true' && success()
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go-controller/go.mod'
        cache-dependency-path: "**/*.sum"
      id: go

    - name: Build - from base branch
      if: steps.is_base_image_build_needed.outputs.BASE_IMAGE_RESTORED != 'true' && success()
      run: |
        set -x
        pushd go-controller
           make
           make windows
        popd

    - name: Build docker image - from base branch
      if: steps.is_base_image_build_needed.outputs.BASE_IMAGE_RESTORED != 'true' && success()
      run: |
        make -C dist/images \
          IMAGE=ovn-daemonset-fedora:dev \
          OVN_REPO=${{ env.OVN_REPO }} \
          OVN_GITREF=${{ env.OVN_GITREF }} \
          fedora-image

    - name: Cache base image
      if: steps.is_base_image_build_needed.outputs.BASE_IMAGE_RESTORED_FROM_CACHE != 'true' && success()
      continue-on-error: false
      run: |
        set -x
        if [ -f ${CI_IMAGE_CACHE}${CI_IMAGE_BASE_TAR} ]; then
            rm -f ${CI_IMAGE_CACHE}${CI_IMAGE_BASE_TAR}
        fi
        if [ -f ${CI_IMAGE_CACHE}${CI_IMAGE_BASE_TAR}.gz ]; then
            rm -f ${CI_IMAGE_CACHE}${CI_IMAGE_BASE_TAR}.gz
        fi
        docker save ovn-daemonset-fedora:dev -o ${CI_IMAGE_BASE_TAR}
        mkdir -p ${CI_IMAGE_CACHE}
        cp ${CI_IMAGE_BASE_TAR} ${CI_IMAGE_CACHE}${CI_IMAGE_BASE_TAR}
        gzip ${CI_IMAGE_CACHE}${CI_IMAGE_BASE_TAR}

    # run the following always if none of the steps before failed
    - uses: actions/upload-artifact@v7
      with:
        name: test-image-base
        path: ${{ env.CI_IMAGE_BASE_TAR }}

  build-pr:
    needs: [ changes, go-cache ]
    # A failed file check must fail this required check, rather than skip it.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false') }}
    name: Build-PR
    runs-on: ubuntu-24.04
    env:
      PR_IMAGE_FAMILY: fedora
      PR_IMAGE: ovn-daemonset-fedora:pr
      PR_IMAGE_TARGET: fedora-image
      PR_IMAGE_ARTIFACT: test-image-pr
    steps:
    - name: Verify changed-file check succeeded
      env:
        CHANGES_RESULT: ${{ needs.changes.result }}
        RUN_CI: ${{ needs.changes.outputs.run_ci }}
      run: test "$CHANGES_RESULT" = success && test "$RUN_CI" = true

    - name: Verify module cache preparation succeeded
      env:
        CACHE_RESULT: ${{ needs.go-cache.result }}
      run: test "$CACHE_RESULT" = success
    # These anchored steps are shared with build-pr-ubuntu below.
    - &restore_pr_image_cache
      name: Restore PR image cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.CI_IMAGE_CACHE }}
        key: ${{ github.run_id }}-image-cache-pr-${{ env.PR_IMAGE_FAMILY }}

    - &check_pr_image_build
      name: Check if PR image build is needed
      id: is_pr_image_build_needed
      continue-on-error: true
      run: |
        set -x
        mkdir -p "${CI_DIST_IMAGES_OUTPUT}"
        if [ -f "${CI_IMAGE_CACHE}/${CI_IMAGE_PR_TAR}.gz" ]; then
            cp "${CI_IMAGE_CACHE}/${CI_IMAGE_PR_TAR}.gz" "${CI_DIST_IMAGES_OUTPUT}/${CI_IMAGE_PR_TAR}.gz"
            gunzip "${CI_DIST_IMAGES_OUTPUT}/${CI_IMAGE_PR_TAR}.gz"
            echo "PR_IMAGE_RESTORED=true" >> "$GITHUB_OUTPUT"
        fi

    # only run the following steps if the PR image was not found in the cache
    - &checkout_pr_image_source
      name: Check out code into the Go module directory - from current pr branch
      if: steps.is_pr_image_build_needed.outputs.PR_IMAGE_RESTORED != 'true' && success()
      uses: actions/checkout@v6

    - &setup_pr_image_go
      name: Set up Go
      if: steps.is_pr_image_build_needed.outputs.PR_IMAGE_RESTORED != 'true' && success()
      uses: ./.github/actions/setup-go
      id: go

    - name: Build - from current pr branch
      if: steps.is_pr_image_build_needed.outputs.PR_IMAGE_RESTORED != 'true' && success()
      run: |
        set -x
        pushd go-controller
           # exit early if there are formatting, go mod / vendor, or license tree issues
           make gofmt
           make verify-go-mod-vendor
           make verify-third-party-licenses
           make
           make windows
        popd

    - &build_pr_image
      name: Build PR image - from current pr branch
      if: steps.is_pr_image_build_needed.outputs.PR_IMAGE_RESTORED != 'true' && success()
      run: |
        pushd dist/images
          make IMAGE="${PR_IMAGE}" \
            OVN_REPO="${OVN_REPO}" \
            OVN_GITREF="${OVN_GITREF}" \
            "${PR_IMAGE_TARGET}"
          mkdir -p _output
          docker save "${PR_IMAGE}" -o "_output/${CI_IMAGE_PR_TAR}"
        popd

    - &cache_pr_image
      name: Cache PR image
      if: steps.is_pr_image_build_needed.outputs.PR_IMAGE_RESTORED != 'true' && success()
      continue-on-error: true
      run: |
        set -x
        mkdir -p "${CI_IMAGE_CACHE}"
        rm -f "${CI_IMAGE_CACHE}/${CI_IMAGE_PR_TAR}" "${CI_IMAGE_CACHE}/${CI_IMAGE_PR_TAR}.gz"
        cp "${CI_DIST_IMAGES_OUTPUT}/${CI_IMAGE_PR_TAR}" "${CI_IMAGE_CACHE}/${CI_IMAGE_PR_TAR}"
        gzip -f "${CI_IMAGE_CACHE}/${CI_IMAGE_PR_TAR}"

    # run the following if none of the previous steps failed
    - &upload_pr_image
      name: Upload PR image
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.PR_IMAGE_ARTIFACT }}
        path: ${{ env.CI_DIST_IMAGES_OUTPUT }}/${{ env.CI_IMAGE_PR_TAR }}

  build-pr-ubuntu:
    needs: [ changes, go-cache ]
    if: needs.changes.outputs.run_ci == 'true'
    name: Build-PR (Ubuntu)
    runs-on: ubuntu-24.04
    env:
      PR_IMAGE_FAMILY: ubuntu
      PR_IMAGE: ovn-daemonset-ubuntu:pr
      PR_IMAGE_TARGET: ubuntu-image
      PR_IMAGE_ARTIFACT: test-image-pr-ubuntu
      CI_IMAGE_PR_TAR: image-pr-ubuntu.tar
    steps:
    - *restore_pr_image_cache
    - *check_pr_image_build
    - *checkout_pr_image_source
    - *setup_pr_image_go
    - *build_pr_image
    - *cache_pr_image
    - *upload_pr_image

  test-pr:
    needs: [ changes, go-cache ]
    if: needs.changes.outputs.run_ci == 'true'
    name: Test-PR
    runs-on: ubuntu-24.04
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: Set up Go
      uses: ./.github/actions/setup-go
      id: go

    - name: Install VRF kernel module
      run: |
        set -x
        # Newer Ubuntu kernels ship vrf in linux-modules and have no
        # linux-modules-extra package, so only install it when needed.
        if ! sudo modprobe vrf; then
          sudo apt update
          sudo apt-get install linux-modules-extra-$(uname -r) -y
          sudo modprobe vrf
        fi

    - name: Run unit tests
      run: |
        set -x
        pushd go-controller
        COVERALLS=1 CONTAINER_RUNNABLE=1 make check
        popd

    # CRD integration tests (envtest — real kube-apiserver + etcd, no Kind
    # cluster) run here alongside the unit tests rather than in a dedicated
    # lane: they are lightweight (seconds) and gate every PR on CRD admission
    # behaviour without spinning up a separate job.
    - name: Run CRD integration tests
      run: |
        set -x
        pushd test
        make test-crd
        popd

    - name: Submit code coverage to Coveralls
      continue-on-error: true
      env:
        COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -x
        go install github.com/mattn/goveralls@latest
        go install github.com/modocache/gover@latest
        PATH=$PATH:$(go env GOPATH)/bin

        mkdir -p $(go env GOPATH)/src/github.com/ovn-kubernetes
        ln -sf $(pwd) $(go env GOPATH)/src/github.com/ovn-kubernetes/ovn-kubernetes

        gover
        GO111MODULE=off goveralls -coverprofile=gover.coverprofile -service=github

  ovn-upgrade-e2e:
    name: Upgrade OVN from Base to PR branch based image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs:
      - build-base
      - build-pr
    strategy:
      fail-fast: false
      matrix:
        gateway-mode: [local, shared]
    env:
      JOB_NAME: "Upgrade-Tests-${{ matrix.gateway-mode }}"
      PLATFORM_IPV4_SUPPORT: "true"
      PLATFORM_IPV6_SUPPORT: "false"
      KIND_IPV4_SUPPORT: "true"
      KIND_IPV6_SUPPORT: "false"
      OVN_HYBRID_OVERLAY_ENABLE: "false"
      OVN_GATEWAY_MODE: "${{ matrix.gateway-mode }}"
      OVN_MULTICAST_ENABLE:  "false"
      # TODO(koolzz): deprecate once infra is switched completely to kind-helm.sh
      USE_HELM: "true"
    steps:

    - name: Check out code into the Go module directory - from Base branch
      uses: actions/checkout@v6
      with:
          ref: ${{ github.base_ref || github.ref_name }}

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go-controller/go.mod'
        # Restore modules after the PR checkout below, avoiding two cache
        # extractions into the same directory with overlapping read-only files.
        cache: false
      id: go

    - name: Set up environment
      run: |
        export GOPATH=$(go env GOPATH)
        echo "GOPATH=$GOPATH" >> $GITHUB_ENV
        echo "$GOPATH/bin" >> $GITHUB_PATH

    - name: Free up disk space
      uses: ./.github/actions/free-disk-space

    - name: Download test-image-base
      uses: actions/download-artifact@v8
      with:
        name: test-image-base

    - name: Disable ufw
      # For IPv6 and Dualstack, ufw (Uncomplicated Firewall) should be disabled.
      # Not needed for KIND deployments, so just disable all the time.
      run: |
        sudo ufw disable

    - name: Disable containerd image store
      # Workaround for https://github.com/kubernetes-sigs/kind/issues/3795
      run: |
        sudo mkdir -p /etc/docker
        docker --version || true
        containerd --version || true
        [ -s "/etc/docker/daemon.json" ] && {
          cat "/etc/docker/daemon.json" | jq '. + {"features":{"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.$$
        } || {
          echo '{"features":{"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.$$
        }
        sudo mv -f /etc/docker/daemon.$$ /etc/docker/daemon.json
        sudo systemctl restart docker

    - name: Load docker image
      run: |
        docker load --input ${CI_IMAGE_BASE_TAR} && rm -rf ${CI_IMAGE_BASE_TAR}
        docker images || true

    - name: kind setup
      run: |
        export OVN_IMAGE="ovn-daemonset-fedora:dev"
        make -C test install-kind

    - name: Check out code into the Go module directory - from PR branch
      uses: actions/checkout@v6

    - name: Restore PR Go modules
      uses: ./.github/actions/setup-go

    - name: Export kind logs
      if: always()
      run: |
        ./contrib/export-kind-logs.sh
        set -x
        docker ps -a
        docker exec ovn-control-plane crictl images
        docker exec ovn-worker crictl images
        docker exec ovn-worker2 crictl images

    - name: Upload kind logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: kind-logs-${{ env.JOB_NAME }}-${{ github.run_id }}
        path: /tmp/kind/logs

    - name: Download test-image-pr
      uses: actions/download-artifact@v8
      with:
        name: test-image-pr

    - name: Load docker image
      run: |
        docker load --input ${CI_IMAGE_PR_TAR} && rm -rf ${CI_IMAGE_PR_TAR}

    - name: ovn upgrade
      run: |
        export OVN_IMAGE="ovn-daemonset-fedora:pr"
        make -C test upgrade-ovn

    - name: Run E2E shard-conformance
      run: |
        make -C test shard-conformance

    - name: Export kind logs
      if: always()
      run: ./contrib/export-kind-logs.sh /tmp/kind/logs-kind-pr-branch

    - name: Upload kind logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: kind-logs-${{ env.JOB_NAME }}-${{ github.run_id }}-after-upgrade
        path: /tmp/kind/logs-kind-pr-branch

    - name: Upload coredumps for post-processing
      if: failure()
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/upload-artifact@v7
      with:
        name: coredumps-${{ env.JOB_NAME }}-${{ github.run_id }}
        path: /tmp/kind/logs/coredumps
        if-no-files-found: ignore
        retention-days: 1

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    # 30 mins for kind, 180 mins for control-plane tests, 10 minutes for all other steps
    timeout-minutes: 220
    strategy:
      fail-fast: false
      matrix:
        # Valid options are:
        # target: ["shard-conformance", "no-uplink", "control-plane", "multi-homing", "node-ip-mac-migration",
        #          "external-gateway", "kv-live-migration", "network-segmentation",
        #          "network-segmentation-dynamic", "bgp", "bgp-no-overlay", "bgp-no-overlay-dynamic", "bgp-loose-isolation",
        #          "evpn", "traffic-flow-test-only", "tools", "serial"]
        #         shard-conformance: hybrid-overlay = multicast-enable = emptylb-enable = false
        #         control-plane: hybrid-overlay = multicast-enable = emptylb-enable = true
        #         targets ending in "-dynamic" run with dynamic UDN allocation enabled
        # gateway-mode: ["local", "shared"]
        # ipfamily: ["ipv4", "ipv6", "dualstack"]
        # disable-snat-multiple-gws: ["noSnatGW", "snatGW"]
        # second-bridge: ["2br", "1br"]
        # ic: ["ic-single-node-zones"]
        # num-workers : "<integer value>"
        # forwarding : ["", "disable-forwarding"]
        # dns-name-resolver : ["", "enable-dns-name-resolver"]
        # network-segmentation : ["", "enable-network-segmentation"]
        # traffic-flow-tests : "<tests range. i.e. 1-24>"
        include:
          - {"target": "shard-conformance", "gateway-mode": "local",  "ipfamily": "dualstack", "disable-snat-multiple-gws": "snatGW",   "second-bridge": "1br", "ic": "ic-single-node-zones"}
          # Keep dedicated coverage for a local gateway bridge without a system uplink so gateway initialization
          # cannot silently fall back to the normal bridge-plus-uplink topology.
          - {"target": "no-uplink", "gateway-mode": "local", "ipfamily": "ipv4", "disable-snat-multiple-gws": "noSnatGW", "second-bridge": "1br", "ic": "ic-single-node-zones"}
          - {"target": "shard-conformance", "gateway-mode": "shared", "ipfamily": "ipv4",      "disable-snat-multiple-gws": "noSnatGW",   "second-bridge": "1br", "ic": "ic-single-node-zones", "routeadvertisements": "advertise-default"}
          - {"target": "shard-conformance", "gateway-mode": "local",  "ipfamily": "dualstack", "disable-snat-multiple-gws": "noSnatGW",   "second-bridge": "1br", "ic": "ic-single-node-zones", "routeadvertisements": "advertise-default"}
          - {"target": "shard-conformance", "gateway-mode": "shared", "ipfamily": "ipv6",      "disable-snat-multiple-gws": "noSnatGW",   "second-bridge": "1br", "ic": "ic-single-node-zones", "routeadvertisements": "advertise-default", "no-overlay": "true"}
          - {"target": "shard-conformance", "gateway-mode": "local",  "ipfamily": "dualstack", "disable-snat-multiple-gws": "noSnatGW",   "second-bridge": "1br", "ic": "ic-single-node-zones", "routeadvertisements": "managed", "no-overlay": "managed"}
          - {"target": "shard-conformance", "gateway-mode": "shared", "ipfamily": "ipv6",      "disable-snat-multiple-gws": "snatGW",   "second-bridge": "1br", "ic": "ic-single-node-zones"}
          - {"target": "shard-conformance", "gateway-mode": "shared", "ipfamily": "ipv4",      "disable-snat-multiple-gws": "snatGW",   "second-bridge": "1br", "ic": "ic-single-node-zones"}
          - {"target": "control-plane", "gateway-mode": "shared", "ipfamily": "ipv4",      "disable-snat-multiple-gws": "snatGW",   "second-bridge": "1br", "ic": "ic-single-node-zones", "dns-name-resolver": "enable-dns-name-resolver"}
          - {"target": "control-plane", "gateway-mode": "local",  "ipfamily": "ipv4",      "disable-snat-multiple-gws": "noSnatGW", "second-bridge": "1br", "ic": "ic-single-node-zones", "dns-name-resolver": "enable-dns-name-resolver", "image_family": "ubuntu"}
          - {"target": "control-plane", "gateway-mode": "local",  "ipfamily": "ipv6",      "disable-snat-multiple-gws": "noSnatGW", "second-bridge": "1br", "ic": "ic-single-node-zones"}
          - {"target": "control-plane", "gateway-mode": "shared", "ipfamily": "ipv4",      "disable-snat-multiple-gws": "noSnatGW", "second-bridge": "2br", "ic": "ic-single-node-zones"}
          - {"target": "control-plane", "gateway-mode": "shared", "ipfamily": "ipv6",      "disable-snat-multiple-gws": "noSnatGW", "second-bridge": "2br", "ic": "ic-single-node-zones", "cni-mode": "unprivileged"}
          - {"target": "multi-homing", "gateway-mode": "shared",  "ipfamily": "dualstack",      "disable-snat-multiple-gws": "SnatGW",   "second-bridge": "1br", "ic": "ic-single-node-zones"}
          - {"target": "node-ip-mac-migration", "gateway-mode": "shared", "ipfamily": "ipv4",      "disable-snat-multiple-gws": "SnatGW",   "second-bridge": "1br", "ic": "ic-single-node-zones"}
          - {"target": "multi-homing", "gateway-mode": "local",  "ipfamily": "dualstack", "disable-snat-multiple-gws": "SnatGW",   "second-bridge": "1br", "ic": "ic-single-node-zones", "network-segmentation": "enable-network-segmentation"}
          - {"target": "external-gateway", "gateway-mode": "shared", "ipfamily": "ipv4",      "disable-snat-multiple-gws": "noSnatGW", "second-bridge": "2br", "ic": "ic-single-node-zones"}
          - {"target": "external-gateway", "gateway-mode": "local",  "ipfamily": "ipv4",      "disable-snat-multiple-gws": "noSnatGW", "second-bridge": "1br", "ic": "ic-single-node-zones"}
          - {"target": "external-gateway", "gateway-mode": "shared", "ipfamily": "ipv6",      "disable-snat-multiple-gws": "noSnatGW", "second-bridge": "2br", "ic": "ic-single-node-zones"}
          - {"target": "external-gateway", "gateway-mode": "local",  "ipfamily": "ipv6",      "disable-snat-multiple-gws": "noSnatGW", "second-bridge": "1br", "ic": "ic-single-node-zones"}
          - {"target": "kv-live-migration", "gateway-mode": "shared", "ipfamily": "dualstack", "disable-snat-multiple-gws": "noSnatGW",   "second-bridge": "1br", "ic": "ic-single-node-zones", "num-workers": "3", "network-segmentation": "enable-network-segmentation", "routeadvertisements": "true"}
          - {"target": "kv-live-migration", "gateway-mode": "local", "ipfamily": "dualstack", "disable-snat-multiple-gws": "noSnatGW",   "second-bridge": "1br", "ic": "ic-single-node-zones", "num-workers": "3", "network-segmentation": "enable-network-segmentation", "routeadvertisements": "true", "evpn": "enable-evpn"}
          - {"target": "control-plane", "gateway-mode": "shared", "ipfamily": "ipv4", "disable-snat-multiple-gws": "SnatGW",   "second-bridge": "1br", "ic": "ic-single-node-zones", "forwarding": "disable-forwarding"}
          - {"target": "network-segmentation", "gateway-mode": "shared", "ipfamily": "dualstack", "disable-snat-multiple-gws": "noSnatGW", "second-bridge": "1br", "ic": "ic-single-node-zones", "forwarding": "disable-forwarding"}
          - {"target": "network-segmentation", "gateway-mode": "local", "ipfamily": "dualstack", "disable-snat-multiple-gws": "noSnatGW", "second-bridge": "1br", "ic": "ic-single-node-zones"}
          - {"target": "network-segmentation-dynamic", "gateway-mode": "shared", "ipfamily": "ipv4", "disable-snat-multiple-gws": "noSnatGW", "second-bridge": "1br", "ic": "ic-single-node-zones", "cni-mode": "unprivileged"}
          - {"target": "network-segmentation", "gateway-mode": "shared", "ipfamily": "ipv6", "disable-snat-multiple-gws": "noSnatGW", "second-bridge": "1br", "ic": "ic-single-node-zones"}
          - {"target": "bgp", "gateway-mode": "local",  "ipfamily": "dualstack", "disable-snat-multiple-gws": "snatGW", "second-bridge": "1br", "ic": "ic-single-node-zones", "routeadvertisements": "advertise-default", "network-segmentation": "enable-network-segmentation", "dns-name-resolver": "enable-dns-name-resolver"}
          - {"target": "bgp", "gateway-mode": "shared",  "ipfamily": "dualstack", "disable-snat-multiple-gws": "noSnatGW", "second-bridge": "1br", "ic": "ic-single-node-zones", "routeadvertisements": "advertise-default", "network-segmentation": "enable-network-segmentation", "dns-name-resolver": "enable-dns-name-resolver"}
          - {"target": "bgp", "gateway-mode": "local",  "ipfamily": "ipv6", "disable-snat-multiple-gws": "snatGW", "second-bridge": "1br", "ic": "ic-single-node-zones", "routeadvertisements": "advertise-default", "network-segmentation": "enable-network-segmentation"}
          # no-overlay mode cannot be enabled alongside other tests: activating it on the default network requires
          # restarting ovn-k pods (day-2 reconfiguration), which would disrupt any concurrently running test jobs.
          # Dedicated no-overlay jobs are therefore required to cover feature combinations that may interact with
          # no-overlay (e.g. BGP route advertisements, network-segmentation) where implementations are not strictly orthogonal.
          - {"target": "bgp-no-overlay-dynamic", "gateway-mode": "shared", "ipfamily": "dualstack", "disable-snat-multiple-gws": "SnatGW",   "second-bridge": "1br", "ic": "ic-single-node-zones", "routeadvertisements": "advertise-default", "network-segmentation": "enable-network-segmentation", "no-overlay": "snat-enabled"}
          - {"target": "bgp-no-overlay", "gateway-mode": "local",  "ipfamily": "dualstack", "disable-snat-multiple-gws": "noSnatGW",   "second-bridge": "1br", "ic": "ic-single-node-zones", "routeadvertisements": "advertise-default", "network-segmentation": "enable-network-segmentation", "no-overlay": "true"}
          - {"target": "bgp-loose-isolation", "gateway-mode": "shared", "ipfamily": "dualstack", "disable-snat-multiple-gws": "snatGW", "second-bridge": "1br", "ic": "ic-single-node-zones", "routeadvertisements": "advertise-default", "network-segmentation": "enable-network-segmentation", "advertised-udn-isolation-mode": "loose"}
          - {"target": "evpn", "gateway-mode": "local", "ipfamily": "dualstack", "disable-snat-multiple-gws": "noSnatGW", "second-bridge": "1br", "ic": "ic-single-node-zones", "routeadvertisements": "advertise-default", "network-segmentation": "enable-network-segmentation", "evpn": "enable-evpn"}
          - {"target": "traffic-flow-test-only", "gateway-mode": "shared", "ipfamily": "ipv4", "disable-snat-multiple-gws": "noSnatGW", "second-bridge": "1br", "ic": "ic-single-node-zones", "traffic-flow-tests": "1-24", "network-segmentation": "enable-network-segmentation"}
          - {"target": "tools", "gateway-mode": "local", "ipfamily": "dualstack", "disable-snat-multiple-gws": "SnatGW", "second-bridge": "1br", "ic": "ic-single-node-zones", "network-segmentation": "enable-network-segmentation"}
          - {"target": "serial", "gateway-mode": "shared", "ipfamily": "ipv4", "disable-snat-multiple-gws": "snatGW", "second-bridge": "1br", "ic": "ic-single-node-zones"}
    needs: [ changes, build-pr, build-pr-ubuntu ]
    if: ${{ !cancelled() && needs.changes.outputs.run_ci == 'true' }}
    env:
      JOB_NAME: "${{ matrix.target }}-${{ matrix.gateway-mode }}-${{ matrix.ipfamily }}-${{ matrix.disable-snat-multiple-gws }}-${{ matrix.second-bridge }}-${{ matrix.ic }}-${{ matrix.image_family || 'fedora' }}"
      OVN_HYBRID_OVERLAY_ENABLE: ${{ matrix.target == 'control-plane' && (matrix.ipfamily == 'ipv4' || matrix.ipfamily == 'dualstack' ) }}
      OVN_MULTICAST_ENABLE:  "${{ matrix.target == 'control-plane' || startsWith(matrix.target, 'network-segmentation') || startsWith(matrix.target, 'bgp') }}"
      OVN_EMPTY_LB_EVENTS: "${{ matrix.target == 'control-plane' || startsWith(matrix.target, 'bgp') }}"
      OVN_IMAGE_FAMILY: "${{ matrix.image_family || 'fedora' }}"
      OVN_IMAGE: "${{ matrix.image_family == 'ubuntu' && 'ovn-daemonset-ubuntu:pr' || 'ovn-daemonset-fedora:pr' }}"
      CI_E2E_IMAGE_ARTIFACT: "${{ matrix.image_family == 'ubuntu' && 'test-image-pr-ubuntu' || 'test-image-pr' }}"
      CI_E2E_IMAGE_TAR: "${{ matrix.image_family == 'ubuntu' && 'image-pr-ubuntu.tar' || 'image-pr.tar' }}"
      OVN_DISABLE_SNAT_MULTIPLE_GWS: "${{ matrix.disable-snat-multiple-gws == 'noSnatGW' }}"
      KIND_INSTALL_METALLB: "${{ matrix.target == 'control-plane' || startsWith(matrix.target, 'network-segmentation') }}"
      OVN_GATEWAY_MODE: "${{ matrix.gateway-mode }}"
      OVN_DUMMY_GATEWAY_BRIDGE: "${{ matrix.target == 'no-uplink' }}"
      OVN_SECOND_BRIDGE: "${{ matrix.second-bridge == '2br' }}"
      ENABLE_MULTI_NET: "${{ matrix.target == 'multi-homing' || matrix.target == 'kv-live-migration' || startsWith(matrix.target, 'network-segmentation') || matrix.target == 'tools' || matrix.target == 'traffic-flow-test-only' || matrix.routeadvertisements != '' }}"
      ENABLE_NETWORK_SEGMENTATION: "${{ startsWith(matrix.target, 'network-segmentation') || matrix.network-segmentation == 'enable-network-segmentation' }}"
      PLATFORM_IPV4_SUPPORT: "${{ matrix.ipfamily == 'IPv4' || matrix.ipfamily == 'dualstack' }}"
      PLATFORM_IPV6_SUPPORT: "${{ matrix.ipfamily == 'IPv6' || matrix.ipfamily == 'dualstack' }}"
      KIND_LOCAL_REGISTRY: "${{ matrix.local-kind-registry == 'true' }}"
      KIND_INSTALL_KUBEVIRT: "${{ matrix.target == 'kv-live-migration' }}"
      # the DHCP IPAM e2e needs the dhcp CNI plugin binary on every node for
      # the regular-pod delegation path (contrib/kind-common.sh install_plugins)
      KIND_INSTALL_PLUGINS: "${{ matrix.target == 'kv-live-migration' }}"
      KIND_NUM_WORKER: "${{ matrix.num-workers }}"
      OVN_DISABLE_FORWARDING: "${{ matrix.forwarding == 'disable-forwarding' }}"
      OVN_ENABLE_DNSNAMERESOLVER: "${{ matrix.dns-name-resolver == 'enable-dns-name-resolver' }}"
      OVN_NETWORK_QOS_ENABLE: "${{ matrix.target == 'control-plane' || matrix.target == 'kv-live-migration' }}"
      TRAFFIC_FLOW_TESTS: "${{ matrix.traffic-flow-tests }}"
      ENABLE_ROUTE_ADVERTISEMENTS: "${{ matrix.routeadvertisements != '' }}"
      ENABLE_EVPN: "${{ matrix.target == 'evpn' || matrix.evpn == 'enable-evpn' }}"
      ADVERTISE_DEFAULT_NETWORK:  "${{ matrix.routeadvertisements == 'advertise-default' }}"
      ENABLE_NETWORK_CONNECT: "${{ startsWith(matrix.target, 'network-segmentation') }}"
      ENABLE_UPLINK: "${{ startsWith(matrix.target, 'network-segmentation') || matrix.network-segmentation == 'enable-network-segmentation' }}"
      ENABLE_PRE_CONF_UDN_ADDR: "${{ matrix.ic == 'ic-single-node-zones' && (startsWith(matrix.target, 'network-segmentation') || matrix.network-segmentation == 'enable-network-segmentation') }}"
      ADVERTISED_UDN_ISOLATION_MODE: "${{ matrix.advertised-udn-isolation-mode }}"
      # Override PARALLEL=true for Serial tests target to run Serial tests
      PARALLEL: "${{ matrix.target != 'serial' }}"
      OVN_UNPRIVILEGED_MODE: "${{ matrix.cni-mode == 'unprivileged' }}"
      MULTI_POD_SUBNET: true
      DYNAMIC_UDN_ALLOCATION: "${{ endsWith(matrix.target, '-dynamic') }}"
      ENABLE_NO_OVERLAY: "${{ matrix.no-overlay != '' }}"
      ENABLE_NO_OVERLAY_OUTBOUND_SNAT: "${{ matrix.no-overlay == 'snat-enabled' || matrix.no-overlay == 'managed' }}"
      ENABLE_NO_OVERLAY_MANAGED_ROUTING: "${{ matrix.no-overlay == 'managed' }}"
    steps:
    - name: Verify selected image build
      env:
        FEDORA_BUILD_RESULT: ${{ needs.build-pr.result }}
        UBUNTU_BUILD_RESULT: ${{ needs.build-pr-ubuntu.result }}
      run: |
        if [ "${OVN_IMAGE_FAMILY}" = "ubuntu" ]; then
          test "${UBUNTU_BUILD_RESULT}" = "success"
        else
          test "${FEDORA_BUILD_RESULT}" = "success"
        fi

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: Install VRF kernel module
      run: |
        set -x
        # Newer Ubuntu kernels ship vrf in linux-modules and have no
        # linux-modules-extra package, so only install it when needed.
        if ! sudo modprobe vrf; then
          sudo apt update
          sudo apt-get install linux-modules-extra-$(uname -r) -y
          sudo modprobe vrf
        fi

    - name: Free up disk space
      uses: ./.github/actions/free-disk-space

    - name: Setup /mnt/runner directory
      run: |
        sudo mkdir -pv /mnt/runner
        sudo chown runner:runner /mnt/runner

    - name: Setup /mnt/docker-data as docker storage
      run: |
        sudo mkdir -pv /mnt/docker-data
        sudo systemctl stop docker.socket docker
        [ -s "/etc/docker/daemon.json" ] && {
          cat "/etc/docker/daemon.json" | jq '. + {"data-root": "/mnt/docker-data"}' | sudo tee /etc/docker/daemon.$$
        } || {
          echo '{"data-root": "/mnt/docker-data"}' | sudo tee /etc/docker/daemon.$$
        }
        sudo mv -f /etc/docker/daemon.$$ /etc/docker/daemon.json
        sudo systemctl start docker docker.socket
        docker system info

    - name: Set up Go
      uses: ./.github/actions/setup-go
      id: go

    - name: Set up environment
      run: |
        export GOPATH=$(go env GOPATH)
        echo "GOPATH=$GOPATH" >> $GITHUB_ENV
        echo "$GOPATH/bin" >> $GITHUB_PATH
        if [ $OVN_SECOND_BRIDGE == "true" ]; then
          # must be "greater" lexigraphically than network "kind", therefore external gateway is named xgw
          echo OVN_TEST_EX_GW_NETWORK=xgw >> $GITHUB_ENV
          echo OVN_ENABLE_EX_GW_NETWORK_BRIDGE=true >> $GITHUB_ENV
        fi
        if [ "$ADVERTISE_DEFAULT_NETWORK" == "true" ]; then
          echo "ADVERTISE_DEFAULT_NETWORK=true" >> $GITHUB_ENV

          # Use proper variable declaration with default values
          if [ $MULTI_POD_SUBNET == "true" ]; then
            NET_CIDR_IPV4=${NET_CIDR_IPV4:-10.243.0.0/23,10.244.0.0/16}
            NET_CIDR_IPV6=${NET_CIDR_IPV6:-fd00:10:243::/63,fd00:10:244::/48}
          else
            NET_CIDR_IPV4=${NET_CIDR_IPV4:-10.244.0.0/16}
            NET_CIDR_IPV6=${NET_CIDR_IPV6:-fd00:10:244::/48}
          fi
          sudo ip a
          sudo ip r

          # Add masquerade rules for both IPv4 and IPv6 networks
          echo "Adding masquerade rule for $NET_CIDR_IPV4"
          IFS=',' read -r -a ELEMENTS <<< "$NET_CIDR_IPV4"
          for element in "${ELEMENTS[@]}"; do
            sudo iptables -t nat -A POSTROUTING -s $element -o eth0 -j MASQUERADE
          done

          echo "Adding masquerade rule for $NET_CIDR_IPV6"
          IFS=',' read -r -a ELEMENTS <<< "$NET_CIDR_IPV6"
          for element in "${ELEMENTS[@]}"; do
            sudo ip6tables -t nat -A POSTROUTING -s $element -o eth0 -j MASQUERADE
          done

          # Verify the rules were added
          echo "IPv4 POSTROUTING rules:"
          sudo iptables -t nat -L POSTROUTING -v

          echo "IPv6 POSTROUTING rules:"
          sudo ip6tables -t nat -L POSTROUTING -v
        fi

    - name: Disable ufw
      # For IPv6 and Dualstack, ufw (Uncomplicated Firewall) should be disabled.
      # Not needed for KIND deployments, so just disable all the time.
      run: |
        sudo ufw disable

    - name: Download selected PR image
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.CI_E2E_IMAGE_ARTIFACT }}

    - name: Disable containerd image store
      # Workaround for https://github.com/kubernetes-sigs/kind/issues/3795
      run: |
        sudo mkdir -p /etc/docker
        docker --version || true
        containerd --version || true
        [ -s "/etc/docker/daemon.json" ] && {
          cat "/etc/docker/daemon.json" | jq '. + {"features":{"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.$$
        } || {
          echo '{"features":{"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.$$
        }
        sudo mv -f /etc/docker/daemon.$$ /etc/docker/daemon.json
        sudo systemctl restart docker

    - name: Load docker image
      run: |
        docker load --input ${CI_E2E_IMAGE_TAR} && rm -rf ${CI_E2E_IMAGE_TAR}
        docker images || true

    - name: kind setup
      timeout-minutes: 30
      run: |
        make -C test install-kind

    - name: traffic-flow-tests setup
      timeout-minutes: 5
      if: env.TRAFFIC_FLOW_TESTS != ''
      run: make -C test traffic-flow-tests WHAT="setup"

    - name: Run Tests
      # e2e tests take ~60 minutes normally, 120 should be more than enough
      # set 3 hours for control-plane tests as these might take a while
      # give 10m extra to give ginkgo chance to timeout before github so that we
      # get its output
      timeout-minutes: ${{ startsWith(matrix.target, 'bgp') && 190 || matrix.target == 'evpn' && 190 || matrix.target == 'control-plane' && 190 || matrix.target == 'external-gateway' && 190 || startsWith(matrix.target, 'network-segmentation') && 190 || 130 }}
      run: |
        if [ "${{ matrix.target }}" == "multi-homing" ]; then
          make -C test control-plane WHAT="Multi Homing"
        elif [ "${{ matrix.target }}" == "no-uplink" ]; then
          make -C test shard-network
        elif [ "${{ matrix.target }}" == "node-ip-mac-migration" ]; then
          make -C test control-plane WHAT="Node IP and MAC address migration"
        elif [ "${{ matrix.target }}" == "external-gateway" ]; then
          make -C test control-plane WHAT="External Gateway"
        elif [ "${{ matrix.target }}" == "kv-live-migration" ]; then
          # the DHCP IPAM suite (dhcp_ipam.go) rides this lane: it is the one
          # provisioned with the dhcp CNI plugin (KIND_INSTALL_PLUGINS),
          # kubevirt and NetworkQoS
          make -C test control-plane WHAT="Kubevirt Virtual Machines|Localnet DHCP IPAM"
        elif [[ "${{ matrix.target }}" == network-segmentation* ]]; then
          make -C test control-plane WHAT="Network Segmentation"
          make -C test control-plane WHAT="ClusterNetworkConnect"
        elif [ "${{ matrix.target }}" == "evpn" ]; then
          make -C test control-plane WHAT="EVPN"
        elif [ "${{ matrix.target }}" == "bgp" ] || [ "${{ matrix.target }}" == "bgp-no-overlay" ] || [ "${{ matrix.target }}" == "bgp-no-overlay-dynamic" ] || [ "${{ matrix.target }}" == "bgp-loose-isolation" ]; then
          make -C test control-plane
        elif [ "${{ matrix.target }}" == "serial" ]; then
          # Run only Serial tests with ginkgo focus
          make -C test control-plane WHAT=Serial
        elif [ "${{ matrix.target }}" == "tools" ]; then
          make -C go-controller build
          make -C test tools
        elif [ "${{ matrix.target }}" == "traffic-flow-test-only" ]; then
          # Traffic Flow Tests can be ran as part of a target, as an additional
          # set of test, set via TRAFFIC_FLOW_TESTS. See below.
          :
        else
          make -C test "${{ matrix.target }}"
          if [ "${{ matrix.ipfamily }}" != "ipv6" ]; then
            make -C test conformance
          fi
        fi

        # If target also specified traffic flow tests to run, do so now
        if [ -n "${TRAFFIC_FLOW_TESTS}" ]; then
          make -C test traffic-flow-tests WHAT="run"
        fi

    - name: Export kind logs
      if: always()
      run: |
        ./contrib/export-kind-logs.sh
        if [ -n "${TRAFFIC_FLOW_TESTS}" ]; then
            mv -v /tmp/{,kind/logs/}traffic_flow_test_result.json ||:
        fi

    - name: Upload kind logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: kind-logs-${{ env.JOB_NAME }}-${{ github.run_id }}-${{ strategy.job-index }}
        path: /tmp/kind/logs

    - name: Upload coredumps for post-processing
      if: failure()
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/upload-artifact@v7
      with:
        name: coredumps-${{ env.JOB_NAME }}-${{ github.run_id }}-${{ strategy.job-index }}
        path: /tmp/kind/logs/coredumps
        if-no-files-found: ignore
        retention-days: 1

  e2e-dual-conversion:
    name: e2e-dual-conversion
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [ build-pr ]
    env:
      JOB_NAME: "DualStack-conversion-shared"
      PLATFORM_IPV4_SUPPORT: "true"
      PLATFORM_IPV6_SUPPORT: "false"
      OVN_HYBRID_OVERLAY_ENABLE: "false"
      OVN_GATEWAY_MODE: "shared"
      OVN_MULTICAST_ENABLE:  "false"
      DUALSTACK_CONVERSION:  "true"
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: Set up Go
      uses: ./.github/actions/setup-go
      id: go

    - name: Set up environment
      run: |
        export GOPATH=$(go env GOPATH)
        echo "GOPATH=$GOPATH" >> $GITHUB_ENV
        echo "$GOPATH/bin" >> $GITHUB_PATH

    - name: Free up disk space
      uses: ./.github/actions/free-disk-space

    - name: Disable ufw
      # For IPv6 and Dualstack, ufw (Uncomplicated Firewall) should be disabled.
      # Not needed for KIND deployments, so just disable all the time.
      run: |
        sudo ufw disable

    - name: Download test-image-pr
      uses: actions/download-artifact@v8
      with:
        name: test-image-pr

    - name: Disable containerd image store
      # Workaround for https://github.com/kubernetes-sigs/kind/issues/3795
      run: |
        sudo mkdir -p /etc/docker
        docker --version || true
        containerd --version || true
        [ -s "/etc/docker/daemon.json" ] && {
          cat "/etc/docker/daemon.json" | jq '. + {"features":{"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.$$
        } || {
          echo '{"features":{"containerd-snapshotter": false}}' | sudo tee /etc/docker/daemon.$$
        }
        sudo mv -f /etc/docker/daemon.$$ /etc/docker/daemon.json
        sudo systemctl restart docker

    - name: Load docker image
      run: |
        docker load --input ${CI_IMAGE_PR_TAR} && rm -rf ${CI_IMAGE_PR_TAR}
        docker images || true


    - name: kind IPv4 setup
      run: |
        export OVN_IMAGE="ovn-daemonset-fedora:pr"
        make -C test install-kind

    - name: Convert IPv4 cluster to Dual Stack
      run: |
        ./contrib/kind-dual-stack-conversion.sh

    - name: Run Dual-Stack Tests
      run: |
        make -C test shard-test WHAT="Networking Granular Checks\|DualStack"

    - name: Run Dual-Stack Control-Plane Tests
      run: |
        make -C test control-plane WHAT="DualStack"

    - name: Export kind logs
      if: always()
      run: ./contrib/export-kind-logs.sh

    - name: Upload kind logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: kind-logs-${{ env.JOB_NAME }}-${{ github.run_id }}
        path: /tmp/kind/logs

    - name: Upload coredumps for post-processing
      if: failure()
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/upload-artifact@v7
      with:
        name: coredumps-${{ env.JOB_NAME }}-${{ github.run_id }}
        path: /tmp/kind/logs/coredumps
        if-no-files-found: ignore
        retention-days: 1

    - name: Export ovn dbs
      if: ${{ failure() }}
      run: |
        mkdir -p /tmp/kind/ovndbs
        for node in ovn-control-plane ovn-worker ovn-worker2
        do for db in ovnnb_db.db ovnsb_db.db
          do docker cp ${node}:/var/lib/openvswitch/${db} /tmp/kind/ovndbs/${node}_${db} ||:
          done
        done

    - name: Upload ovn dbs
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: kind-ovndbs-${{ env.JOB_NAME }}-${{ github.run_id }}
        path: /tmp/kind/ovndbs

  coredump-stacktraces:
    name: Collect coredump stack traces
    if: always() && contains(needs.*.result, 'failure')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs:
      - ovn-upgrade-e2e
      - e2e
      - e2e-dual-conversion
    steps:
    - name: Check out code
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Free up disk space
      continue-on-error: true
      timeout-minutes: 10
      uses: ./.github/actions/free-disk-space

    - name: Download coredumps from failed E2E lanes
      uses: actions/download-artifact@v8
      with:
        pattern: coredumps-*
        path: /tmp/coredumps

    - name: Extract and print coredump stack traces
      continue-on-error: true
      timeout-minutes: 90
      run: ./contrib/coredump/collect-stacktraces.sh /tmp/coredumps /tmp/stacktraces

    - name: Upload combined coredump stack traces
      if: always()
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/upload-artifact@v7
      with:
        name: coredump-stacktraces-${{ github.run_id }}
        path: /tmp/stacktraces
        if-no-files-found: ignore
