{{- if eq (hasKey .Values.global "enableOvnKubeIdentity" | ternary .Values.global.enableOvnKubeIdentity true) true }}
# Create self signed CA and webhook cert
# NOTE: The CA and certificate are not renewed after they expire, this should only be used in development environments
{{- $ca := genCA "self-signed-ca" 400 }}
{{- $cert := genSignedCert "localhost" nil (list "localhost") 365 $ca }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ovnkube-webhook-cert
  namespace: ovn-kubernetes
data:
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
type: kubernetes.io/tls

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: ovn-kubernetes-admission-webhook-node
webhooks:
  - name: ovn-kubernetes-admission-webhook-node.k8s.io
    clientConfig:
      url: https://localhost:9443/node
      caBundle: {{ $ca.Cert | b64enc | quote }}
    admissionReviewVersions: ['v1']
    sideEffects: None
    rules:
      - operations: [ "UPDATE" ]
        apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["nodes/status"] # Using /status subresource doesn't protect from other users changing the annotations
        scope: "*"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: ovn-kubernetes-admission-webhook-pod
webhooks:
  - name: ovn-kubernetes-admission-webhook-pod.k8s.io
    clientConfig:
      url: https://localhost:9443/pod
      caBundle: {{ $ca.Cert | b64enc | quote }}
    admissionReviewVersions: ['v1']
    sideEffects: None
    matchConditions:
      # Avoid a bootstrap dependency on the identity webhook for its own pods.
      # Skip only when neither the old nor the new pod has protected annotations;
      # adding, removing, or retaining it must still invoke admission, even if
      # the caller supplies the identity pod label.
      - name: skip-ovnkube-identity-self-pods
        expression: >-
          !(request.namespace == "ovn-kubernetes" && has(object.metadata.labels) &&
          "name" in object.metadata.labels && object.metadata.labels["name"] == "ovnkube-identity" &&
          [object, oldObject].all(p, p == null || !has(p.metadata.annotations) ||
            !["k8s.ovn.org/pod-networks", "k8s.ovn.org/dpu.connection-details",
              "k8s.ovn.org/dpu.connection-status"].exists(k, k in p.metadata.annotations)))
    rules:
      - operations: [ "CREATE", "UPDATE" ]
        apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["pods", "pods/status"]
        scope: "*"
{{- end }}
