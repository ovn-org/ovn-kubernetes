apiVersion: v1
kind: ServiceAccount
metadata:
    name: ovnkube-cluster-manager
    namespace: ovn-kubernetes

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: ovnkube-cluster-manager
roleRef:
    name: ovnkube-cluster-manager
    kind: ClusterRole
    apiGroup: rbac.authorization.k8s.io
subjects:
    - kind: ServiceAccount
      name: ovnkube-cluster-manager
      namespace: ovn-kubernetes

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: ovnkube-cluster-manager-configmaps
    namespace: ovn-kubernetes
roleRef:
    name: ovn-k8s-configmap
    kind: Role
    apiGroup: rbac.authorization.k8s.io
subjects:
    - kind: ServiceAccount
      name: ovnkube-cluster-manager
      namespace: ovn-kubernetes

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: ovnkube-cluster-manager
rules:
    - apiGroups: [""]
      resources:
          - namespaces
          - nodes
          - pods
          - services
          - endpoints
      verbs: [ "get", "list", "watch" ]
    - apiGroups: ["discovery.k8s.io"]
      resources:
          - endpointslices
      verbs: [ "get", "list", "watch" ]
    - apiGroups: ["k8s.cni.cncf.io"]
      resources:
          - ipamclaims
          - network-attachment-definitions
          - multi-networkpolicies
      verbs: ["list", "get", "watch"]
    - apiGroups: [ "k8s.cni.cncf.io" ]
      resources:
      - ipamclaims/status
      - network-attachment-definitions
      verbs: [ "patch", "update" ]
    - apiGroups: [ "k8s.cni.cncf.io" ]
      resources:
      - network-attachment-definitions
      verbs: [ "create", "delete" ]
    - apiGroups: ["k8s.ovn.org"]
      resources:
          - egressips
          - egressservices
          - adminpolicybasedexternalroutes
          - egressfirewalls
          - egressqoses
          - networkqoses
          - userdefinednetworks
          - clusteruserdefinednetworks
          - uplinks
          - uplinkstates
          - vteps
      verbs: [ "get", "list", "watch" ]
    - apiGroups: ["k8s.ovn.org"]
      resources:
          - egressips
          - egressservices/status
          - networkqoses/status
          - userdefinednetworks
          - userdefinednetworks/status
          - clusteruserdefinednetworks
          - clusteruserdefinednetworks/status
          - clusteruserdefinednetworks/finalizers
          - uplinks
          - uplinks/status
          - vteps
          - vteps/status
      verbs: ["patch", "update"]
    - apiGroups: ["k8s.ovn.org"]
      resources:
          - uplinkstates
      verbs: ["create", "delete"]
    - apiGroups: [""]
      resources:
          - events
      verbs: ["create", "patch", "update"]
    - apiGroups: [""]
      resources:
          - pods/status # used in multi-homing: https://github.com/ovn-kubernetes/ovn-kubernetes/blob/a9beb6fd4f8ea32b264999a8ebec25cd6bdc2281/go-controller/pkg/util/pod.go#L49
          - nodes/status
          - services/status
      verbs: [ "patch", "update" ]
    - apiGroups: ["k8s.ovn.org"]
      resources:
        - adminpolicybasedexternalroutes/status
        - egressfirewalls/status
        - egressqoses/status
      verbs: [ "patch", "update" ]
    - apiGroups: ["policy.networking.k8s.io"]
      resources:
          - adminnetworkpolicies
          - baselineadminnetworkpolicies
      verbs: [ "list" ]
    - apiGroups: ["policy.networking.k8s.io"]
      resources:
          - adminnetworkpolicies/status
          - baselineadminnetworkpolicies/status
      verbs: [ "patch" ]

    {{- if eq (hasKey .Values.global "enableNetworkSegmentation" | ternary .Values.global.enableNetworkSegmentation false) true }}
    - apiGroups: ["discovery.k8s.io"]
      resources:
          - endpointslices
      verbs: [ "create", "update", "delete", "deletecollection" ]
    {{- end }}
    {{- if eq (hasKey .Values.global "enableDNSNameResolver" | ternary .Values.global.enableDNSNameResolver false) true }}
    - apiGroups: ["network.openshift.io"]
      resources:
          - dnsnameresolvers
      verbs: [ "create", "delete", "list", "patch", "update", "watch" ]
    {{- end }}
    {{- if eq (hasKey .Values.global "enableRouteAdvertisements" | ternary .Values.global.enableRouteAdvertisements false) true }}
    - apiGroups: ["k8s.ovn.org"]
      resources:
          - routeadvertisements
      verbs: [ "get", "list", "watch", "create", "delete", "patch", "update" ]
    - apiGroups: ["k8s.ovn.org"]
      resources:
          - routeadvertisements/status
      verbs: [ "patch", "update" ]
    - apiGroups: ["frrk8s.metallb.io"]
      resources:
          - frrconfigurations
      verbs: [ "create", "delete", "get", "list", "patch", "update", "watch" ]
    {{- end }}
    {{- if eq (hasKey .Values.global "enableNetworkConnect" | ternary .Values.global.enableNetworkConnect false) true }}
    - apiGroups: ["k8s.ovn.org"]
      resources:
          - clusternetworkconnects
      verbs: [ "get", "list", "watch" ]
    - apiGroups: ["k8s.ovn.org"]
      resources:
          - clusternetworkconnects
          - clusternetworkconnects/status
      verbs: [ "patch", "update" ]
    {{- end }}

---
# Prevent adding/removing the primary-user-defined-network namespace label after namespace creation.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: user-defined-networks-namespace-label
spec:
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["UPDATE"]
        resources:   ["namespaces"]
  failurePolicy: Fail
  validations:
    - expression: "('k8s.ovn.org/primary-user-defined-network' in oldObject.metadata.labels) == ('k8s.ovn.org/primary-user-defined-network' in object.metadata.labels)"
      message: "The 'k8s.ovn.org/primary-user-defined-network' label cannot be added/removed after the namespace was created"

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: user-defined-networks-namespace-label-binding
spec:
  policyName: user-defined-networks-namespace-label
  validationActions: [Deny]
  matchResources:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["UPDATE"]
        resources:   ["namespaces"]

{{- if eq (hasKey .Values.global "enablePreconfiguredUDNAddresses" | ternary .Values.global.enablePreconfiguredUDNAddresses false) true }}
---
# Prevent changing the default-network annotation on a pod after creation.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: default-network-annotation
spec:
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["UPDATE"]
        resources:   ["pods"]
  failurePolicy: Fail
  validations:
    - expression: >
        (has(oldObject.metadata.annotations) && 'v1.multus-cni.io/default-network' in oldObject.metadata.annotations)
        ? (has(object.metadata.annotations) && 'v1.multus-cni.io/default-network' in object.metadata.annotations &&
           oldObject.metadata.annotations['v1.multus-cni.io/default-network'] == object.metadata.annotations['v1.multus-cni.io/default-network'])
        : (!has(object.metadata.annotations) || !('v1.multus-cni.io/default-network' in object.metadata.annotations))
      message: "The 'v1.multus-cni.io/default-network' annotation cannot be changed after the pod was created"

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: default-network-annotation-binding
spec:
  policyName: default-network-annotation
  validationActions: [Deny]
  matchResources:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["UPDATE"]
        resources:   ["pods"]
{{- end }}

---
# Prevent users from adding/modifying the egressip-mark annotation, which is managed by ovn-kubernetes.
# Only the ovnkube-cluster-manager service account is permitted to set this annotation.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: egressip-mark-annotation-validation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["k8s.ovn.org"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["egressips"]
  validations:
  - expression: 'request.operation != "CREATE" || !has(object.metadata.annotations) || !("k8s.ovn.org/egressip-mark" in object.metadata.annotations)'
    message: 'EgressIP resources cannot be created with the "k8s.ovn.org/egressip-mark" annotation. This annotation is managed by the system.'
    reason: Invalid
  - expression: 'request.operation != "UPDATE" || !has(oldObject.metadata.annotations) || !("k8s.ovn.org/egressip-mark" in oldObject.metadata.annotations) || (has(object.metadata.annotations) && ("k8s.ovn.org/egressip-mark" in object.metadata.annotations) && oldObject.metadata.annotations["k8s.ovn.org/egressip-mark"] == object.metadata.annotations["k8s.ovn.org/egressip-mark"])'
    message: 'The "k8s.ovn.org/egressip-mark" annotation cannot be modified or removed once set. This annotation is managed by the system.'
    reason: Invalid
  - expression: 'request.operation != "UPDATE" || !has(object.metadata.annotations) || !("k8s.ovn.org/egressip-mark" in object.metadata.annotations) || (has(oldObject.metadata.annotations) && ("k8s.ovn.org/egressip-mark" in oldObject.metadata.annotations)) || request.userInfo.username == "system:serviceaccount:ovn-kubernetes:ovnkube-cluster-manager"'
    message: 'A regular user must not add "k8s.ovn.org/egressip-mark" annotation to an EgressIP custom resource.'
    reason: Invalid

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: egressip-mark-annotation-validation-binding
spec:
  policyName: egressip-mark-annotation-validation
  validationActions: [Deny]

{{- if eq (hasKey .Values.global "enableNetworkConnect" | ternary .Values.global.enableNetworkConnect false) true }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cnc-annotation-validation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["k8s.ovn.org"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["clusternetworkconnects"]
  validations:
  # Prevent creating ClusterNetworkConnect with either annotation
  - expression: >-
      request.operation != "CREATE" ||
      !has(object.metadata.annotations) ||
      (!("k8s.ovn.org/network-connect-subnet" in object.metadata.annotations) &&
      !("k8s.ovn.org/connect-router-tunnel-key" in object.metadata.annotations))
    message: >-
      ClusterNetworkConnect resources cannot be created with the
      "k8s.ovn.org/network-connect-subnet" or "k8s.ovn.org/connect-router-tunnel-key"
      annotations. These annotations are managed by the system.
    reason: Invalid
  # Immutable once set; only cluster-manager can add connect-router-tunnel-key.
  # Passes when:
  #   Branch 1 - neither old nor new has the annotation (no change)
  #   Branch 2 - both have it with the same value (no modification)
  #   Branch 3 - annotation is being added and user is cluster-manager
  - expression: >-
      request.operation != "UPDATE" ||
      ((!has(oldObject.metadata.annotations) ||
      !("k8s.ovn.org/connect-router-tunnel-key" in oldObject.metadata.annotations)) &&
      (!has(object.metadata.annotations) ||
      !("k8s.ovn.org/connect-router-tunnel-key" in object.metadata.annotations))) ||
      (has(oldObject.metadata.annotations) &&
      "k8s.ovn.org/connect-router-tunnel-key" in oldObject.metadata.annotations &&
      has(object.metadata.annotations) &&
      "k8s.ovn.org/connect-router-tunnel-key" in object.metadata.annotations &&
      oldObject.metadata.annotations["k8s.ovn.org/connect-router-tunnel-key"] ==
      object.metadata.annotations["k8s.ovn.org/connect-router-tunnel-key"]) ||
      ((!has(oldObject.metadata.annotations) ||
      !("k8s.ovn.org/connect-router-tunnel-key" in oldObject.metadata.annotations)) &&
      has(object.metadata.annotations) &&
      "k8s.ovn.org/connect-router-tunnel-key" in object.metadata.annotations &&
      request.userInfo.username ==
      "system:serviceaccount:ovn-kubernetes:ovnkube-cluster-manager")
    message: >-
      The "k8s.ovn.org/connect-router-tunnel-key" annotation is immutable once set
      and can only be added by the cluster-manager service account.
    reason: Invalid
  # Only cluster-manager can add, modify, or remove network-connect-subnet.
  # Passes when:
  #   Branch 1 - user is cluster-manager (any mutation allowed)
  #   Branch 2 - neither old nor new has the annotation (no change)
  #   Branch 3 - both have it with the same value (no modification)
  - expression: >-
      request.operation != "UPDATE" ||
      request.userInfo.username ==
      "system:serviceaccount:ovn-kubernetes:ovnkube-cluster-manager" ||
      ((!has(oldObject.metadata.annotations) ||
      !("k8s.ovn.org/network-connect-subnet" in oldObject.metadata.annotations)) &&
      (!has(object.metadata.annotations) ||
      !("k8s.ovn.org/network-connect-subnet" in object.metadata.annotations))) ||
      (has(oldObject.metadata.annotations) &&
      "k8s.ovn.org/network-connect-subnet" in oldObject.metadata.annotations &&
      has(object.metadata.annotations) &&
      "k8s.ovn.org/network-connect-subnet" in object.metadata.annotations &&
      oldObject.metadata.annotations["k8s.ovn.org/network-connect-subnet"] ==
      object.metadata.annotations["k8s.ovn.org/network-connect-subnet"])
    message: >-
      A regular user must not add, modify, or remove the
      "k8s.ovn.org/network-connect-subnet" annotation on a
      ClusterNetworkConnect custom resource.
    reason: Invalid

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cnc-annotation-validation-binding
spec:
  policyName: cnc-annotation-validation
  validationActions: [Deny]
{{- end }}
