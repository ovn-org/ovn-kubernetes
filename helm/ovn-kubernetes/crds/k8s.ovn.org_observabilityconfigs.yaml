---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: observabilityconfigs.k8s.ovn.org
spec:
  group: k8s.ovn.org
  names:
    kind: ObservabilityConfig
    listKind: ObservabilityConfigList
    plural: observabilityconfigs
    singular: observabilityconfig
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ObservabilityConfig describes the OVN Observability API, which binds
          observed samples to a collector ID, for a given set of features and filters.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ObservabilitySpec defines the desired state of ObservabilityConfig.
            properties:
              collectorID:
                description: |-
                  CollectorID is the OVN Sample_Collector set_id used to bind samples to a collector on
                  the consumer side. It must be unique across the cluster.
                format: int64
                maximum: 4294967295
                minimum: 1
                type: integer
              features:
                description: Features is a list of Observability features that can
                  generate samples and their probabilities for a given collector.
                items:
                  description: FeatureConfig defines per-feature configuration, such
                    as its sampling probability.
                  properties:
                    feature:
                      description: Feature is the Observability feature that should
                        be sampled.
                      enum:
                      - NetworkPolicy
                      - AdminNetworkPolicy
                      - EgressFirewall
                      - UDNIsolation
                      - MulticastIsolation
                      type: string
                    probability:
                      description: Probability is the probability of the feature being
                        sampled in percent.
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                  required:
                  - feature
                  - probability
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - feature
                x-kubernetes-list-type: map
              filter:
                description: Filter allows to apply ObservabilityConfig in a granular
                  manner.
                minProperties: 1
                properties:
                  namespaces:
                    description: |-
                      namespaces is a list of namespaces to which the ObservabilityConfig should be applied.
                      It only applies to the namespaced features, currently that includes NetworkPolicy and EgressFirewall.
                    items:
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    maxItems: 100
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  nodeSelector:
                    description: nodeSelector applies ObservabilityConfig only to
                      nodes that match the selector.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
            required:
            - collectorID
            - features
            type: object
            x-kubernetes-validations:
            - message: filter.namespaces can only be used with namespaced features
                (NetworkPolicy, EgressFirewall)
              rule: '!has(self.filter) || !has(self.filter.namespaces) || size(self.filter.namespaces)
                == 0 || self.features.all(f, f.feature == ''NetworkPolicy'' || f.feature
                == ''EgressFirewall'')'
          status:
            description: ObservabilityStatus contains the observed status of the ObservabilityConfig.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
