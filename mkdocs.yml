site_name: OVN-Kubernetes
site_url: https://www.ovn.org/ovn-kubernetes/
repo_url: https://github.com/ovn-kubernetes/ovn-kubernetes
repo_name: ovn-kubernetes/ovn-kubernetes
edit_uri: edit/master/docs
extra:
  version:
    provider: mike
    default:
      - latest
      - master
extra_css:
  - stylesheets/extra.css
site_dir: site
docs_dir: docs
copyright: Copyright © OVN-Kubernetes a Series of LF Projects, LLC. For website terms of use, trademark policy and other project policies please see <a href="https://lfprojects.org/policies/">LF Projects Policies</a>.
theme:
  name: material
  icon:
    repo: fontawesome/brands/git-alt
  logo: images/ovn-inside-k8s.png
  favicon: images/ovn-inside-k8s.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.annotate
    - content.code.copy
plugins:
  - search
  - meta-descriptions
  - awesome-pages
  - mike
  - mermaid2
  - macros
  - blog:
      # NOTE: configuration options can be found at
      # https://squidfunk.github.io/mkdocs-material/setup/setting-up-a-blog/
      blog_dir: blog
      blog_toc: true
      post_excerpt: required
      post_excerpt_max_authors: 2
  - glightbox:
      touchNavigation: true
      loop: false
      zoomable: true
      draggable: true
  - redirects:
      redirect_maps: {}
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true
markdown_extensions:
  - admonition
  - meta
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: site-src
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: ovn-kubernetes
      repo: ovn-kubernetes
  - pymdownx.mark
  - toc:
      permalink: true
